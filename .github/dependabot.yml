version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Give new releases a few days to get yanked if something's wrong with
    # them. Doesn't apply to security updates.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # majors get their own PR, they're more likely to break things
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
